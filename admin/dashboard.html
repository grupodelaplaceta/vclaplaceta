<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CRM Voley Club La Placeta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- SIDEBAR -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/vc.png" alt="V" style="width:40px;height:40px;object-fit:contain;flex-shrink:0;">
        <div class="sidebar-brand">Voley Club<br><span>La Placeta</span></div>
      </div>
      <div class="sidebar-user" id="sidebarUser">
        <strong>Cargando...</strong>
        <span class="role-badge">-</span>
      </div>
      <div class="sidebar-nav">
        <div class="nav-label">Panel</div>
        <a href="dashboard.html" class="active"><i class="fas fa-chart-pie"></i> Dashboard</a>
        
        <div class="nav-label">Gestión</div>
        <a href="finanzas.html"><i class="fas fa-euro-sign"></i> Fondos</a>
        <a href="cuotas.html"><i class="fas fa-users"></i> Cuotas y Socios</a>
        <a href="torneos.html"><i class="fas fa-trophy"></i> Torneos</a>
        
        <div class="nav-label">Sistema</div>
        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
      </div>
      <div class="sidebar-footer">
        <a href="../index.html"><i class="fas fa-external-link-alt"></i> Ver web pública</a>
        <div class="security-badge" style="margin-top:0.5rem;"><i class="fas fa-shield-alt"></i> Conexión segura</div>
      </div>
    </nav>
    <div class="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('open'); document.querySelector('.sidebar-overlay').classList.remove('show')"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <div class="admin-topbar">
        <h2><i class="fas fa-chart-pie"></i> Dashboard</h2>
        <div class="admin-topbar-right">
          <div class="notif-bell" onclick="toggleNotif()">
            <i class="fas fa-bell"></i>
            <span class="badge" id="notifBadge">0</span>
            <div class="notif-dropdown" id="notifDropdown"></div>
          </div>
          <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open'); document.querySelector('.sidebar-overlay').classList.toggle('show')" style="display:none;">
            <i class="fas fa-bars"></i>
          </button>
          <span style="font-size:0.85rem; color:var(--admin-text-light);" id="userDisplay"></span>
          <span id="convocatoriaBadge" style="display:none; font-size:0.72rem; font-weight:600; padding:0.2rem 0.6rem; border-radius:50px;"></span>
        </div>
      </div>

      <!-- STATS CARDS -->
      <div class="stats-cards" id="statsCards"></div>

      <!-- FONDOS: BLOQUEADOS VS DISPONIBLE -->
      <div class="card-admin" id="fundsCard"></div>

      <!-- ÚLTIMOS MOVIMIENTOS -->
      <div class="card-admin">
        <div class="card-admin-header">
          <h3><i class="fas fa-history"></i> Últimos Movimientos</h3>
          <a href="finanzas.html" class="btn-admin btn-outline-admin btn-admin-sm">Ver todos</a>
        </div>
        <div id="ultimosMovimientos"></div>
      </div>

      <!-- NOTIFICACIONES -->
      <div class="card-admin" id="notificacionesCard"></div>
    </div>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle" style="color:var(--admin-success);"></i> <span id="toastMsg">Operación exitosa</span></div>

  <script src="../js/api-client.js"></script>
  <script src="../js/crm-data.js?v=2"></script>
  <script>
    const user = getCurrentUser();
    if (!user) { window.location.href = 'login.html'; }
    
    // Sidebar user info
    document.getElementById('sidebarUser').innerHTML = `
      <strong>${user.name}</strong>
      <span class="role-badge">${user.role === 'gestor' ? 'Gestor' : 'Responsable'}</span>
    `;
    document.getElementById('userDisplay').textContent = `${user.name} (${user.role})`;
    
    async function renderDashboard() {
      let stats;
      try {
        stats = await API.getDashboard();
      } catch(e) {
        stats = getEstadisticasDashboard();
      }
      
      // Convocatoria badge
      const badge = document.getElementById('convocatoriaBadge');
      const abierta = isConvocatoriaAbierta();
      badge.style.display = 'inline-flex';
      badge.style.alignItems = 'center';
      badge.style.gap = '0.3rem';
      badge.style.background = abierta ? 'rgba(46,204,113,0.1)' : 'rgba(231,76,60,0.1)';
      badge.style.color = abierta ? '#27ae60' : '#c0392b';
      badge.innerHTML = `<i class="fas fa-${abierta ? 'check-circle' : 'exclamation-circle'}"></i> Convocatoria: ${abierta ? 'Abierta' : 'Cerrada'}`;
      
      // Stats cards
      document.getElementById('statsCards').innerHTML = `
        <div class="stat-card-admin">
          <div class="stat-icon bg-purple-light"><i class="fas fa-euro-sign"></i></div>
          <div class="stat-number">${formatEUR(stats.saldoActual)}</div>
          <div class="stat-label">Saldo Actual</div>
          <div class="stat-sub">+${formatEUR(stats.totalIngresos)} ingresos | ${formatEUR(stats.totalGastos)} gastos</div>
        </div>
        <div class="stat-card-admin">
          <div class="stat-icon bg-orange-light"><i class="fas fa-users"></i></div>
          <div class="stat-number">${stats.miembrosActivos}</div>
          <div class="stat-label">Socios Activos</div>
          <div class="stat-sub">${stats.morosos} con cuotas pendientes</div>
        </div>
        <div class="stat-card-admin">
          <div class="stat-icon bg-green-light"><i class="fas fa-trophy"></i></div>
          <div class="stat-number">${stats.torneosPendientes}</div>
          <div class="stat-label">Torneos Pendientes</div>
          <div class="stat-sub">${stats.solicitudesPendientes} solicitudes de socio</div>
        </div>
        <div class="stat-card-admin">
          <div class="stat-icon bg-blue-light"><i class="fas fa-bell"></i></div>
          <div class="stat-number">${stats.notificacionesNoLeidas}</div>
          <div class="stat-label">Notificaciones</div>
          <div class="stat-sub">Pendientes de revisión</div>
        </div>
      `;
      
      // Notif badge
      document.getElementById('notifBadge').textContent = stats.notificacionesNoLeidas;
      if (stats.notificacionesNoLeidas === 0) document.getElementById('notifBadge').style.display = 'none';
      
      // Funds breakdown
      const total = stats.saldoActual;
      const bloqueado = stats.fondosBloqueados;
      const disponible = stats.fondosDisponibles;
      const pctBloq = total > 0 ? Math.round((bloqueado / total) * 100) : 0;
      const pctDisp = total > 0 ? Math.round((disponible / total) * 100) : 0;
      
      document.getElementById('fundsCard').innerHTML = `
        <div class="card-admin-header">
          <h3><i class="fas fa-chart-line"></i> Estado de Fondos</h3>
        </div>
        <div class="stats-cards" style="margin-bottom:0;">
          <div class="stat-card-admin">
            <div class="stat-icon bg-purple-light"><i class="fas fa-wallet"></i></div>
            <div class="stat-number">${formatEUR(total)}</div>
            <div class="stat-label">Saldo Total</div>
          </div>
          <div class="stat-card-admin">
            <div class="stat-icon bg-orange-light"><i class="fas fa-lock"></i></div>
            <div class="stat-number">${formatEUR(bloqueado)}</div>
            <div class="stat-label">Bloqueado (proyectos)</div>
          </div>
          <div class="stat-card-admin">
            <div class="stat-icon bg-green-light"><i class="fas fa-check-circle"></i></div>
            <div class="stat-number">${formatEUR(disponible)}</div>
            <div class="stat-label">Disponible</div>
          </div>
          <div class="stat-card-admin">
            <div class="stat-icon bg-blue-light"><i class="fas fa-trophy"></i></div>
            <div class="stat-number">${formatEUR(stats.gastoTorneos)}</div>
            <div class="stat-label">Gastado torneos</div>
          </div>
        </div>
        <div style="margin-top:1rem;">
          <p style="font-size:0.85rem; color:var(--admin-text-light); margin-bottom:0.3rem;">
            <strong>Distribución:</strong> ${formatEUR(bloqueado)} proyectos (${pctBloq}%) · ${formatEUR(disponible)} disponible (${pctDisp}%)
          </p>
          <div class="budget-bar" style="height:14px;">
            <div style="display:flex; height:100%; border-radius:7px; overflow:hidden;">
              <div style="width:${pctBloq}%; background:var(--admin-accent); transition:width 0.5s;"></div>
              <div style="width:${pctDisp}%; background:var(--admin-success); transition:width 0.5s;"></div>
            </div>
          </div>
        </div>
      `;
      
      // Últimos movimientos
      const movs = getHistorial().slice(0, 5);
      document.getElementById('ultimosMovimientos').innerHTML = `
        <table class="table-admin">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Concepto</th>
              <th>Categoría</th>
              <th>Registrado por</th>
              <th>Importe</th>
            </tr>
          </thead>
          <tbody>
            ${movs.map(m => `
              <tr>
                <td>${formatDateCRM(m.fecha)}</td>
                <td>${m.concepto}</td>
                <td><span class="badge badge-accent">${m.categoria}</span></td>
                <td>${m.registradoPor === 'gestor' ? 'Gestor' : 'Responsable'}</td>
                <td style="color:${m.tipo === 'ingreso' ? 'var(--admin-success)' : 'var(--admin-danger)'}; font-weight:700;">
                  ${m.tipo === 'ingreso' ? '+' : '-'}${formatEUR(m.cantidad)}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      
      // Notificaciones
      const notifs = getNotificaciones().slice(0, 5);
      document.getElementById('notificacionesCard').innerHTML = `
        <div class="card-admin-header">
          <h3><i class="fas fa-bell"></i> Notificaciones Recientes</h3>
          <button class="btn-admin btn-outline-admin btn-admin-sm" onclick="marcarTodasLeidas(); renderDashboard();">
            Marcar todas leídas
          </button>
        </div>
        ${notifs.length === 0 ? '<p style="color:var(--admin-text-light);">No hay notificaciones</p>' : ''}
        ${notifs.map(n => `
          <div style="padding:0.8rem 0; border-bottom:1px solid var(--admin-border); display:flex; align-items:center; gap:1rem; ${!n.leida ? 'background:rgba(255,109,0,0.03); margin:0 -1rem; padding:0.8rem 1rem;' : ''}">
            <i class="fas fa-${n.tipo === 'solicitud' ? 'file-invoice' : n.tipo === 'socio' ? 'user-plus' : 'exclamation-triangle'}" 
               style="color:${n.leida ? 'var(--admin-text-light)' : 'var(--admin-accent)'};"></i>
            <div style="flex:1;">
              <p style="font-size:0.85rem; ${!n.leida ? 'font-weight:600;' : ''}">${n.mensaje}</p>
              <p style="font-size:0.7rem; color:var(--admin-text-light); margin-top:0.2rem;">${formatDateCRM(n.fecha)}</p>
            </div>
            <a href="${n.url}" class="btn-admin btn-outline-admin btn-admin-sm" onclick="marcarNotificacionLeida(${n.id})">Ver</a>
          </div>
        `).join('')}
      `;
    }
    
    function toggleNotif() {
      const dd = document.getElementById('notifDropdown');
      dd.classList.toggle('show');
      if (dd.classList.contains('show')) {
        const notifs = getNotificaciones().slice(0, 6);
        dd.innerHTML = notifs.map(n => `
          <div class="notif-item ${!n.leida ? 'no-leida' : ''}" onclick="marcarNotificacionLeida(${n.id}); window.location.href='${n.url}';">
            <p>${n.mensaje}</p>
            <p class="notif-date">${formatDateCRM(n.fecha)}</p>
          </div>
        `).join('');
      }
    }
    
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.notif-bell')) {
        document.getElementById('notifDropdown').classList.remove('show');
      }
    });
    
    renderDashboard();
  </script>
</body>
</html>
