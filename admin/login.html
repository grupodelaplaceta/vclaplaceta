<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso CRM - Voley Club La Placeta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">V</div>
      <h1>CRM Voley Club</h1>
      <p>Acceso al panel de gestión</p>
      
      <div class="login-error" id="loginError">
        <i class="fas fa-exclamation-circle"></i> <span id="errorMsg">Credenciales incorrectas</span>
      </div>

      <form id="loginForm">
        <div class="form-group-admin">
          <label><i class="fas fa-user"></i> Usuario</label>
          <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
        </div>
        <div class="form-group-admin">
          <label><i class="fas fa-lock"></i> Contraseña</label>
          <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-admin btn-primary-admin" style="width:100%; justify-content:center; padding:0.8rem; font-size:0.9rem; margin-top:0.5rem;">
          <i class="fas fa-arrow-right"></i> Acceder
        </button>
      </form>

      <div style="margin-top:1.5rem; padding-top:1.5rem; border-top:1px solid var(--admin-border); font-size:0.8rem; color:var(--admin-text-light); text-align:center;">
        <p><strong>Accesos:</strong></p>
        <p style="margin-top:0.3rem;">Gestor: <strong>gestor</strong> / <strong>gestor2026</strong></p>
        <p>Responsable: <strong>admin</strong> / <strong>admin2026</strong></p>
      </div>

      <div style="text-align:center; margin-top:1.2rem;">
        <a href="../index.html" style="color:var(--admin-text-light); font-size:0.8rem; text-decoration:none;">
          <i class="fas fa-arrow-left"></i> Volver a la web
        </a>
      </div>
    </div>
  </div>

  <script src="../js/api-client.js"></script>
  <script src="../js/crm-data.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      try {
        const result = await API.login(username, password);
        if (result.success) {
          window.location.href = 'dashboard.html';
        } else {
          throw new Error(result.error);
        }
      } catch(err) {
        // Fallback a localStorage
        const result = login(username, password);
        if (result.success) {
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('loginError').style.display = 'block';
          document.getElementById('errorMsg').textContent = result.error;
        }
      }
    });
  </script>
</body>
</html>
