<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificando identidad… - Voley Club La Placeta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a0040 0%, #2a0090 100%); }
    .callback-box { background:#fff; color:#1a1a2e; border-radius:16px; padding:2.5rem 2rem; max-width:420px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .spinner { width:48px; height:48px; border:4px solid #eee; border-top-color:#ff6d00; border-radius:50%; margin:0 auto 1.2rem; animation:spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .callback-box h1 { font-size:1.2rem; font-weight:800; margin-bottom:.5rem; }
    .callback-box p { font-size:.9rem; color:#666; }
  </style>
</head>
<body>
  <div class="callback-box">
    <div class="spinner"></div>
    <h1>Verificando tu identidad</h1>
    <p id="status">Conectando con PlacetaID…</p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || params.get('placetaid_token');
      var userStr = params.get('user');

      function fail(msg) {
        document.getElementById('status').textContent = msg || 'No se recibieron datos de autenticación.';
      }

      if (!token || !userStr) {
        // Permitir modo demo local: ?demo=DIP
        var demo = params.get('demo');
        if (demo) {
          sessionStorage.setItem('vcpl_jugador_dip', demo.trim().toUpperCase());
          sessionStorage.setItem('vcpl_jugador_nombre', 'Jugador (demo)');
          window.location.href = '../area-jugador.html';
          return;
        }
        fail('No se recibieron datos de autenticación.');
        setTimeout(function(){ window.location.href = '../area-jugador.html'; }, 2500);
        return;
      }

      try {
        var user = JSON.parse(decodeURIComponent(userStr));
        sessionStorage.setItem('vcpl_jugador_token', token);
        sessionStorage.setItem('vcpl_jugador_user', JSON.stringify(user));
        sessionStorage.setItem('vcpl_jugador_dip', (user.dip || '').trim().toUpperCase());
        sessionStorage.setItem('vcpl_jugador_nombre', user.nombreCompleto || user.nombre || '');
        document.getElementById('status').textContent = 'Identidad verificada. Cargando tu área…';
        setTimeout(function(){ window.location.href = '../area-jugador.html'; }, 400);
      } catch (e) {
        fail('Error procesando los datos de PlacetaID.');
        setTimeout(function(){ window.location.href = '../area-jugador.html'; }, 2500);
      }
    })();
  </script>
</body>
</html>
